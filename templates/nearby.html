{% extends "base.html" %}
{% block title %}주변정보{% endblock %}
{% block content %}
<h1>주변 관광정보</h1>
<label for="village-id">마을</label>
<select id="village-id"></select>
<button id="load-nearby" type="button">조회</button>
<div id="nearby-results"></div>
{% endblock %}
{% block scripts %}
<script>
function formatDistance(meters) {
  const value = Number(meters);
  if (!Number.isFinite(value)) return '거리 정보 없음';
  return `${(value / 1000).toFixed(1)}km`;
}

function photoFrame(item) {
  const frame = document.createElement('div');
  frame.className = 'photo-frame';
  const markEmpty = () => {
    frame.replaceChildren();
    const empty = document.createElement('p');
    empty.className = 'photo-empty';
    empty.textContent = '사진 없음';
    frame.append(empty);
  };
  const url = String(item.image_url || '').trim();
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    markEmpty();
    return frame;
  }
  const img = document.createElement('img');
  img.alt = item.title || '주변 관광지';
  img.loading = 'lazy';
  img.addEventListener('error', markEmpty);
  img.src = url;
  frame.append(img);
  return frame;
}

function placeCard(item) {
  const card = document.createElement('article');
  card.className = 'place-card';
  const body = document.createElement('div');
  body.className = 'place-body';
  const kind = document.createElement('p');
  kind.className = 'badge';
  kind.textContent = item.content_type || '관광정보';
  const title = document.createElement('h3');
  title.textContent = item.title || '이름 없음';
  const addr = document.createElement('p');
  addr.textContent = item.addr || '주소 없음';
  const dist = document.createElement('p');
  dist.className = 'muted';
  dist.textContent = formatDistance(item.distance_m);
  body.append(kind, title, addr, dist);
  card.append(photoFrame(item), body);
  return card;
}

function placeSection(title, items) {
  const section = document.createElement('section');
  const heading = document.createElement('h2');
  heading.textContent = title;
  const grid = document.createElement('div');
  grid.className = 'place-grid';
  items.forEach((item) => grid.append(placeCard(item)));
  section.append(heading, grid);
  return section;
}

function renderNearby(data) {
  const box = document.createElement('div');
  const attractions = data.attractions || [];
  const restaurants = data.restaurants || [];
  if (!attractions.length && !restaurants.length) {
    const p = document.createElement('p');
    p.textContent = data.status === 'unavailable'
      ? '정보를 불러오지 못했습니다.'
      : '주변에 등록된 관광정보가 없습니다.';
    box.append(p);
    return box;
  }
  if (attractions.length) box.append(placeSection('관광지', attractions));
  if (restaurants.length) box.append(placeSection('음식점', restaurants));
  return box;
}

async function loadVillageOptions() {
  const select = document.getElementById('village-id');
  const res = await fetch('/api/villages');
  const data = await res.json();
  const villages = data.villages || [];
  if (!villages.length) {
    select.replaceChildren();
    const option = document.createElement('option');
    option.value = '';
    option.textContent = '마을 없음';
    select.append(option);
    return;
  }
  select.replaceChildren();
  const bySigungu = new Map();
  villages.forEach((village) => {
    const key = village.sigungu || '시군구 미상';
    if (!bySigungu.has(key)) bySigungu.set(key, []);
    bySigungu.get(key).push(village);
  });
  [...bySigungu.keys()].sort().forEach((sigungu) => {
    const group = document.createElement('optgroup');
    group.label = sigungu;
    bySigungu.get(sigungu).forEach((village) => {
      const option = document.createElement('option');
      option.value = village.village_id || '';
      option.textContent = village.village_name || village.village_id || '이름 없음';
      group.append(option);
    });
    select.append(group);
  });
  const requested = new URLSearchParams(location.search).get('village_id') || '';
  if (requested && [...select.options].some((option) => option.value === requested)) {
    select.value = requested;
    document.getElementById('load-nearby').click();
  }
}

document.getElementById('load-nearby').addEventListener('click', async () => {
  const villageId = document.getElementById('village-id').value;
  const box = document.getElementById('nearby-results');
  if (!villageId) {
    const p = document.createElement('p');
    p.textContent = '등록된 마을이 없습니다. 시드 데이터를 먼저 넣어 주세요.';
    box.replaceChildren(p);
    return;
  }
  const res = await fetch(`/api/nearby?village_id=${encodeURIComponent(villageId)}`);
  const data = await res.json();
  box.replaceChildren(renderNearby(data));
});

loadVillageOptions();
</script>
{% endblock %}
