<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}체험마을 AI사무장{% endblock %}</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <link rel="stylesheet" href="/static/css/brand.css?v=20261031c">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="/brand">
        <span class="logo-mark" aria-hidden="true"></span>
        체험마을 AI사무장
      </a>
      <nav class="nav" aria-label="소개 화면">
        <a href="/brand"{% if page == "brand" %} aria-current="page"{% endif %}>브랜드</a>
        <a href="/story"{% if page == "story" %} aria-current="page"{% endif %}>서비스 이야기·이용 안내</a>
        <a href="/">홈</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="container footer-inner">
      <strong>체험마을 AI사무장</strong>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
