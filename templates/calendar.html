{% extends "base.html" %}
{% block title %}체험 달력{% endblock %}
{% block content %}
<section id="calendar-app" data-token="{{ token }}" data-mode="{{ mode }}">
  <h1 id="calendar-title">체험 달력</h1>
  <p id="calendar-status" class="muted">일정을 불러오는 중입니다.</p>
  <ul id="program-list" class="program-list"></ul>
  <div id="pending-list" hidden></div>
  <div class="month-bar">
    <button type="button" id="prev-month">이전달</button>
    <strong id="month-label"></strong>
    <button type="button" id="next-month">다음달</button>
  </div>
  <div class="week-names" aria-hidden="true">
    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
  </div>
  <div id="month-grid" class="month-grid"></div>
  <h2 id="day-title">날짜를 눌러 주세요</h2>
  <div id="day-entries"></div>
  <form id="entry-form" hidden>
    <label>체험
      <select id="program-label"></select>
    </label>
    <label>단체 이름
      <input type="text" id="group-name" placeholder="광주소등학교">
    </label>
    <label>인원
      <input type="number" id="num-people" min="1" inputmode="numeric">
    </label>
    <button type="submit">이 날짜에 저장</button>
  </form>
  <form id="guest-form" hidden>
    <label>체험
      <select id="guest-program"></select>
    </label>
    <label>시간
      <input type="time" id="visit-time" required>
    </label>
    <label>인원
      <input type="number" id="guest-people" min="1" inputmode="numeric">
    </label>
    <button type="submit">이 날짜에 예약</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/calendar.js?v=20261029k"></script>
{% endblock %}
